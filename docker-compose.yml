services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_ml
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11435:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      network: host
    ports:
      - '8000:8000'
    volumes:
      - uploads_data:/app/uploads
      - models_data:/app/models
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_ml
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DB_SSL_REQUIRED: 'false'
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  models_data:
  ollama_data: